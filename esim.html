```html
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eSIM 상품 찾기 | 여행심플</title>
  <meta name="description" content="여행 국가와 기간에 맞는 eSIM 상품을 비교하세요.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="/">여행심플</a>
      <nav>
        <a href="countries.html">국가별 eSIM</a>
        <a href="install.html">설치방법</a>
        <a href="contact.html">문의</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <div class="result-head">
      <div>
        <span class="eyebrow">ESIM SEARCH</span>
        <h1 id="title">일본 eSIM</h1>
        <p id="subtitle">여행 기간에 맞는 상품을 확인하세요.</p>
      </div>
      <a class="back" href="/">← 다시 검색</a>
    </div>

    <section class="filter-panel search-panel">
      <div class="filter-field">
        <label for="search-country">여행 국가</label>
        <select id="search-country">
          <option value="JP">일본</option>
          <option value="TW">대만</option>
          <option value="VN">베트남</option>
          <option value="TH">태국</option>
          <option value="US">미국</option>
        </select>
      </div>

      <div class="filter-field">
        <label for="search-days">여행 기간</label>
        <select id="search-days">
          <option value="1">1일</option>
          <option value="3">3일</option>
          <option value="5" selected>5일</option>
          <option value="7">7일</option>
          <option value="10">10일</option>
          <option value="15">15일</option>
          <option value="30">30일</option>
        </select>
      </div>
    </section>

    <section class="filter-panel">
      <div class="filter-field">
        <label for="sort">상품 정렬</label>
        <select id="sort">
          <option value="recommended">추천순</option>
          <option value="price-asc">최저가순</option>
          <option value="price-desc">최고가순</option>
        </select>
      </div>

      <label class="filter-check">
        <input type="checkbox" id="unlimited">
        무제한 데이터만
      </label>

      <label class="filter-check">
        <input type="checkbox" id="hotspot">
        핫스팟 가능 상품만
      </label>
    </section>

    <div id="status" class="status">상품 정보를 불러오는 중입니다.</div>
    <div id="products" class="product-grid"></div>

    <section class="notice">
      <h2>상품 안내</h2>
      <p>
        상품 정보와 가격은 실시간 판매 데이터에 따라 달라질 수 있습니다.
        데이터 제공 조건, 이용기간 및 최종 가격은 구매 페이지에서 확인하세요.
      </p>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <strong>여행심플</strong>
      <div>
        <a href="privacy.html">개인정보처리방침</a>
        <a href="terms.html">이용약관</a>
        <a href="contact.html">문의</a>
      </div>
    </div>
  </footer>

  <script src="assets/esim.js"></script>
</body>
</html>
```
